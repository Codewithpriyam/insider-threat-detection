spring.application.name=insider-threat-detection
server.port=8080

# File upload limits for bulk CSV log ingestion
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Default: In-memory H2 database (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:insiderthreatdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Uncomment below to connect to local MySQL database:
# spring.datasource.url=jdbc:mysql://localhost:3306/insider_threat_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
